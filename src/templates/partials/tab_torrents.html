<div id="tab-torrents" class="tab-content">
    <div class="action-forms-container">
        <div class="action-card" style="flex: 100%;">
            <h3><i class="fas fa-magnet icon"></i> Add Torrent</h3>
            <form id="add-torrent-form" class="styled-form" style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <label for="torrent_magnet">Magnet Link:</label>
                    <input type="text" id="torrent_magnet" name="magnet_link" placeholder="Pega el enlace magnet aquí...">
                </div>
                <div style="font-weight: bold; padding-bottom: 10px; color: #6c757d;">O</div>
                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                    <label for="torrent_file">Torrent File:</label>
                    <div class="custom-file-input-wrapper">
                        <input type="file" id="torrent_file" name="torrent_file" accept=".torrent">
                        <label for="torrent_file" class="custom-file-label">
                            <i class="fas fa-file-upload"></i> <span class="file-chosen-text">Select File...</span>
                        </label>
                    </div>
                </div>
                <div class="form-group" style="flex: 1; min-width: 250px; margin-bottom: 0; padding-left: 15px; border-left: 2px solid #dee2e6;">
                    <label>Save to:</label>
                    <div style="display: flex; align-items: center; gap: 10px; background-color: #f8f9fa; border: 1px solid #ced4da; border-radius: 4px; padding: 5px 10px;">
                        <input type="hidden" id="download_path" name="download_path" value="__root__">
                        <button type="button" id="open-torrent-folder-btn" class="btn btn-secondary btn-sm" style="white-space: nowrap; padding: 4px 8px;"><i class="fas fa-folder-open"></i> Select Folder</button>
                        <span id="selected-path-display" style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #495057; font-weight: 500;">Root Directory (/)</span>
                    </div>
                </div>
                <button type="submit" id="submit-torrent-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Add</button>
            </form>
            <div id="torrent-feedback" style="margin-top: 10px; font-weight: bold;"></div>
        </div>
    </div>
    
    <h3 style="max-width: 1200px; margin: 0 auto 15px auto; padding: 0 30px; color: #495057;"><i class="fas fa-list-ul"></i> Active Downloads</h3>
    <table>
        <thead>
            <tr>
                <th style="width: 45%;">Name</th>
                <th style="width: 20%;">Progress</th>
                <th style="width: 15%;">Speed</th>
                <th style="width: 10%;">Status</th>
                <th style="width: 10%; text-align: center;">Actions</th>
            </tr>
        </thead>
        <tbody id="torrent-list-body">
            <tr>
                <td colspan="4" style="text-align: center; padding: 20px; color: #888;">Loading downloads...</td>
            </tr>
        </tbody>
    </table>
</div>
